<section aria-label="Variedades de café disponibles">
  <div class="table-responsive">
    <table class="table">
      <caption class="visually-hidden">Variedades de café disponibles en la tienda</caption>
      <thead>
        <tr>
          <th scope="col">#</th>
          <th scope="col">Nombre</th>
          <th scope="col">Tipo</th>
          <th scope="col">Región</th>
        </tr>
      </thead>
      <tbody>
        @for (cafe of cafes; track cafe.id) {
          <tr>
            <th scope="row">{{ cafe.id }}</th>
            <td>{{ cafe.nombre }}</td>
            <td>{{ cafe.tipo }}</td>
            <td>{{ cafe.region }}</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
  <div class="totals">
    <p>Total café de origen: {{ totalOrigen }}</p>
    <p>Total café blend: {{ totalBlend }}</p>
  </div>
</section>
